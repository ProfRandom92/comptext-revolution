[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ct-vault-core"
version = "0.2.0"
description = "CT-Vault Core — Proven KVTC + MemPalace from 12.665 LOC, integrated into CompText Revolution"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "typer>=0.12",
    "watchdog>=3.0",
    "mcp>=1.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
ct-vault = "ct_vault_core.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ct_vault_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
