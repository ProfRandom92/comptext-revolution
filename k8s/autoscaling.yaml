apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ct-vault-python-hpa
  namespace: comptext
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ct-vault-python
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ct-vault-mcp-hpa
  namespace: comptext
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ct-vault-mcp
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
