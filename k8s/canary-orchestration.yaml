apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: ct-vault-python
  namespace: comptext
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ct-vault-python
  progressDeadlineSeconds: 300
  service:
    port: 8000
  analysis:
    interval: 1m
    threshold: 10
    maxWeight: 50
    stepWeight: 10
    metrics:
    - name: request-success-rate
      thresholdRange:
        min: 99
      interval: 1m
    - name: request-duration
      thresholdRange:
        max: 500
      interval: 1m
    - name: token-savings
      thresholdRange:
        min: 70
      interval: 1m
  webhooks:
  - name: health-check
    url: http://localhost:8000/health
    timeout: 30s
    metadata:
      type: bash
      cmd: "curl -sd 'test' http://localhost:8000/health | grep -q healthy && echo OK || echo FAIL"
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: ct-vault-mcp
  namespace: comptext
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ct-vault-mcp
  progressDeadlineSeconds: 300
  service:
    port: 3000
  analysis:
    interval: 2m
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
    - name: request-success-rate
      thresholdRange:
        min: 99
      interval: 1m
