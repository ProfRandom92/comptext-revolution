apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comptext-ingress
  namespace: comptext
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.comptext.io
    secretName: comptext-tls
  rules:
  - host: api.comptext.io
    http:
      paths:
      - path: /compress
        pathType: Prefix
        backend:
          service:
            name: ct-vault-python
            port:
              number: 8000
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: ct-vault-python
            port:
              number: 8000
      - path: /index
        pathType: Prefix
        backend:
          service:
            name: ct-vault-python
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ct-vault-mcp
            port:
              number: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ct-vault-python-pdb
  namespace: comptext
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ct-vault-python
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ct-vault-mcp-pdb
  namespace: comptext
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ct-vault-mcp
