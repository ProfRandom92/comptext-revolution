apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: comptext
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    rule_files:
    - /etc/prometheus/rules/*.yml
    scrape_configs:
    - job_name: 'ct-vault-python'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [comptext]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ct-vault-python
      - source_labels: [__address__]
        regex: ([^:]+)(?::\d+)?
        replacement: ${1}:8000
        target_label: __address__
    - job_name: 'ct-vault-mcp'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [comptext]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: ct-vault-mcp
      - source_labels: [__address__]
        regex: ([^:]+)(?::\d+)?
        replacement: ${1}:3000
        target_label: __address__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: comptext
data:
  canary-alerts.yml: |
    groups:
    - name: ct-vault-canary
      interval: 30s
      rules:
      - alert: CanaryStabilityLow
        expr: rate(http_requests_total{job=~"ct-vault.*", status=~"5.."}[5m]) > 0.05
        for: 2m
        annotations:
          summary: "Canary stability below 95%"
      - alert: CanaryLatencyHigh
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        annotations:
          summary: "Canary latency p99 > 500ms"
      - alert: CompressionSavingsLow
        expr: avg(comptext_compression_savings_pct) < 70
        for: 5m
        annotations:
          summary: "Compression savings < 70%"
