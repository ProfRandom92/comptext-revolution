apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-vault-python
  namespace: comptext
  labels:
    app: ct-vault-python
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ct-vault-python
  template:
    metadata:
      labels:
        app: ct-vault-python
        version: latest
    spec:
      containers:
      - name: ct-vault-python
        image: ghcr.io/your-org/ct-vault-python:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: vault-storage
          mountPath: /home/vault/.comptext
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: ct-vault-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ct-vault-python
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ct-vault-python
  namespace: comptext
  labels:
    app: ct-vault-python
spec:
  type: ClusterIP
  selector:
    app: ct-vault-python
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
