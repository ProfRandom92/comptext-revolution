apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-vault-mcp
  namespace: comptext
  labels:
    app: ct-vault-mcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ct-vault-mcp
  template:
    metadata:
      labels:
        app: ct-vault-mcp
        version: latest
    spec:
      containers:
      - name: ct-vault-mcp
        image: ghcr.io/your-org/ct-vault-mcp:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: USE_PYTHON
          value: "true"
        - name: CT_VAULT_API
          value: "http://ct-vault-python:8000"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "require('net').createConnection({port:3000}, () => process.exit(0)).on('error', () => process.exit(1))"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ct-vault-mcp
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ct-vault-mcp
  namespace: comptext
  labels:
    app: ct-vault-mcp
spec:
  type: ClusterIP
  selector:
    app: ct-vault-mcp
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
